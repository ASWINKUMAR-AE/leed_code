<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode Auto-Solver Dashboard</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-base: #080710;
            --bg-surface: rgba(255, 255, 255, 0.06);
            --bg-surface-hover: rgba(255, 255, 255, 0.1);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary: #ec4899;
            --secondary-glow: rgba(236, 72, 153, 0.4);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.4);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --transition-speed: 0.3s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border-color);
            background: rgba(8, 7, 16, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-logo i {
            color: var(--primary);
            -webkit-text-fill-color: initial;
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-surface);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
            box-shadow: 0 0 8px var(--text-muted);
        }

        .status-dot.running {
            background-color: var(--success);
            box-shadow: 0 0 12px var(--success-glow);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
            100% { transform: scale(1); opacity: 1; }
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            display: grid;
            grid-template-columns: 1.1fr 1.3fr;
            gap: 2rem;
            flex-grow: 1;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0.7;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .panel-title i {
            color: var(--primary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            color: var(--text-muted);
            pointer-events: none;
            width: 18px;
            height: 18px;
        }

        .input-wrapper input, .input-wrapper select {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all var(--transition-speed);
        }

        .input-wrapper input:focus, .input-wrapper select:focus {
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .input-wrapper .toggle-password {
            position: absolute;
            right: 1rem;
            left: auto;
            pointer-events: auto;
            cursor: pointer;
        }

        /* Custom select styling override */
        select {
            appearance: none;
        }

        /* Difficulty Options cards */
        .difficulty-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
        }

        .difficulty-card {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.75rem;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-speed);
            background: rgba(255, 255, 255, 0.02);
            font-weight: 600;
            font-size: 0.9rem;
            user-select: none;
        }

        .difficulty-card.easy:hover, .difficulty-card.easy.active {
            border-color: var(--success);
            color: var(--success);
            background: rgba(16, 185, 129, 0.08);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
        }

        .difficulty-card.medium:hover, .difficulty-card.medium.active {
            border-color: #f59e0b;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.08);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.2);
        }

        .difficulty-card.hard:hover, .difficulty-card.hard.active {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(239, 68, 68, 0.08);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
        }

        /* Slider */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .slider-container input[type="range"] {
            flex-grow: 1;
            accent-color: var(--primary);
            height: 6px;
            border-radius: 3px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
        }

        .slider-val {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            font-size: 0.85rem;
            min-width: 60px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            user-select: none;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .checkbox-container input {
            accent-color: var(--primary);
            width: 16px;
            height: 16px;
        }

        /* Buttons styling */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .btn {
            width: 100%;
            padding: 0.9rem 1.5rem;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all var(--transition-speed);
            font-family: inherit;
        }

        .btn-boot {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-boot:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
        }

        .btn-boot:active {
            transform: translateY(0);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            box-shadow: 0 4px 15px var(--danger-glow);
            display: none; /* Hidden by default */
        }

        .btn-stop:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
        }

        .btn-stop:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* Terminal Logs Panel styling */
        .terminal-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            min-height: 500px;
        }

        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
            margin-bottom: 1rem;
        }

        .terminal-actions {
            display: flex;
            gap: 0.5rem;
        }

        .terminal-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-speed);
        }

        .terminal-btn:hover {
            background: var(--bg-surface-hover);
            color: var(--text-main);
            border-color: var(--primary);
        }

        .terminal-body {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            flex-grow: 1;
            padding: 1.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            line-height: 1.6;
            overflow-y: auto;
            max-height: 550px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            scroll-behavior: smooth;
        }

        .log-entry {
            display: flex;
            gap: 0.5rem;
            word-break: break-all;
            white-space: pre-wrap;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-entry.system { color: var(--primary); }
        .log-entry.auth { color: var(--secondary); }
        .log-entry.navigation { color: #3b82f6; }
        .log-entry.problem { color: #f59e0b; }
        .log-entry.editor { color: #14b8a6; }
        .log-entry.ai { color: #a855f7; }
        .log-entry.submit { color: #06b6d4; }
        .log-entry.success { color: var(--success); font-weight: bold; }
        .log-entry.error { color: var(--danger); font-weight: bold; }
        .log-entry.warning { color: #eab308; }

        .log-time {
            color: var(--text-muted);
            font-size: 0.75rem;
            user-select: none;
            min-width: 65px;
        }

        footer {
            padding: 2rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        /* Provider Toggle View Logic */
        .provider-key-group {
            display: none;
        }
        .provider-key-group.active {
            display: flex;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">
            <i data-lucide="zap"></i>
            <span>LeetCode Auto-Solver</span>
        </div>
        <div class="status-badge">
            <div id="statusDot" class="status-dot"></div>
            <span id="statusText">System Idle</span>
        </div>
    </header>

    <div class="container">
        <!-- Control Panel Panel -->
        <div class="panel">
            <div class="panel-title">
                <i data-lucide="sliders"></i>
                <span>Control Panel</span>
            </div>

            <!-- LeetCode Credentials -->
            <div class="form-group">
                <label><i data-lucide="user"></i> LeetCode Account Email</label>
                <div class="input-wrapper">
                    <i data-lucide="mail"></i>
                    <input type="email" id="leetcodeEmail" placeholder="Enter LeetCode Email" value="{{ config.email }}">
                </div>
            </div>

            <div class="form-group">
                <label><i data-lucide="lock"></i> LeetCode Password</label>
                <div class="input-wrapper">
                    <i data-lucide="key-round"></i>
                    <input type="password" id="leetcodePassword" placeholder="Enter LeetCode Password" value="{{ config.password }}">
                    <i data-lucide="eye" class="toggle-password" id="togglePasswordBtn" onclick="togglePasswordVisibility()"></i>
                </div>
            </div>

            <!-- API Configuration -->
            <div class="form-row">
                <div class="form-group">
                    <label><i data-lucide="cpu"></i> AI Provider</label>
                    <div class="input-wrapper">
                        <i data-lucide="network"></i>
                        <select id="apiProvider" onchange="onProviderChange()">
                            <option value="gemini" {% if config.provider == 'gemini' %}selected{% endif %}>Gemini API</option>
                            <option value="openrouter" {% if config.provider == 'openrouter' %}selected{% endif %}>OpenRouter</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i data-lucide="bot"></i> AI Model</label>
                    <div class="input-wrapper">
                        <i data-lucide="box"></i>
                        <select id="apiModel">
                            <!-- Populated dynamically via JS -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- Key for Gemini -->
            <div class="form-group provider-key-group" id="geminiKeyGroup">
                <label><i data-lucide="key"></i> Gemini API Key</label>
                <div class="input-wrapper">
                    <i data-lucide="shield-check"></i>
                    <input type="password" id="geminiKey" placeholder="Enter Gemini API Key" value="{{ config.gemini_key }}">
                </div>
            </div>

            <!-- Key for OpenRouter -->
            <div class="form-group provider-key-group" id="openrouterKeyGroup">
                <label><i data-lucide="key"></i> OpenRouter API Key</label>
                <div class="input-wrapper">
                    <i data-lucide="shield-check"></i>
                    <input type="password" id="openrouterKey" placeholder="Enter OpenRouter API Key" value="{{ config.openrouter_key }}">
                </div>
            </div>

            <!-- Problem Filtering -->
            <div class="form-row">
                <div class="form-group">
                    <label><i data-lucide="tag"></i> Problem Topic</label>
                    <div class="input-wrapper">
                        <i data-lucide="code-2"></i>
                        <select id="problemTopic">
                            <option value="all" {% if config.topic == 'all' %}selected{% endif %}>All Topics</option>
                            <option value="algorithms" {% if config.topic == 'algorithms' %}selected{% endif %}>Algorithms</option>
                            <option value="database" {% if config.topic == 'database' %}selected{% endif %}>Database</option>
                            <option value="shell" {% if config.topic == 'shell' %}selected{% endif %}>Shell</option>
                            <option value="concurrency" {% if config.topic == 'concurrency' %}selected{% endif %}>Concurrency</option>
                            <option value="javascript" {% if config.topic == 'javascript' %}selected{% endif %}>JavaScript</option>
                            <option value="pandas" {% if config.topic == 'pandas' %}selected{% endif %}>Pandas</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label><i data-lucide="bar-chart-2"></i> Difficulty Status</label>
                    <input type="hidden" id="problemDifficulty" value="{{ config.difficulty }}">
                    <div class="difficulty-options">
                        <div class="difficulty-card easy {% if config.difficulty == 'EASY' %}active{% endif %}" onclick="setDifficulty('EASY')">Easy</div>
                        <div class="difficulty-card medium {% if config.difficulty == 'MEDIUM' %}active{% endif %}" onclick="setDifficulty('MEDIUM')">Medium</div>
                        <div class="difficulty-card hard {% if config.difficulty == 'HARD' %}active{% endif %}" onclick="setDifficulty('HARD')">Hard</div>
                    </div>
                </div>
            </div>

            <!-- Typing Speed Delay -->
            <div class="form-group">
                <label><i data-lucide="keyboard"></i> Human Typing Delay</label>
                <div class="slider-container">
                    <input type="range" id="typingDelay" min="1" max="100" value="{{ config.typing_delay }}" oninput="updateSliderVal(this.value)">
                    <span class="slider-val" id="typingDelayVal">{{ config.typing_delay }} ms</span>
                </div>
            </div>

            <!-- Save Config Checkbox -->
            <label class="checkbox-container">
                <input type="checkbox" id="saveConfig" checked>
                <span>Save credentials & API keys locally to .env</span>
            </label>

            <!-- Launch buttons -->
            <div class="btn-group">
                <button id="bootBtn" class="btn btn-boot" onclick="bootProgram()">
                    <i data-lucide="play"></i>
                    <span>Boot Program</span>
                </button>
                <button id="stopBtn" class="btn btn-stop" onclick="stopProgram()">
                    <i data-lucide="square"></i>
                    <span>Stop Program</span>
                </button>
            </div>
        </div>

        <!-- Terminal Output Panel -->
        <div class="panel terminal-panel">
            <div class="terminal-header">
                <div class="panel-title" style="border: none; padding: 0; margin: 0;">
                    <i data-lucide="terminal"></i>
                    <span>Live Console Monitor</span>
                </div>
                <div class="terminal-actions">
                    <button class="terminal-btn" onclick="clearLogs()" title="Clear terminal">
                        <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
                    </button>
                    <button class="terminal-btn" onclick="copyLogs()" title="Copy logs to clipboard">
                        <i data-lucide="copy" style="width: 16px; height: 16px;"></i>
                    </button>
                </div>
            </div>

            <div class="terminal-body" id="terminal">
                <div class="log-entry system">
                    <span class="log-time" id="initTime">--:--:--</span>
                    <span>Dashboard ready. Adjust parameters and click "Boot Program" to start automation.</span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>Developed with premium styling &bull; LeetCode Auto-Solver Automation Engine &copy; 2026</p>
    </footer>

    <script>
        // Preset Model lists
        const MODELS = {
            gemini: [
                { value: "gemini-2.5-flash", label: "Gemini 2.5 Flash" }
            ],
            openrouter: [
                { value: "google/gemma-4-31b-it:free", label: "google/gemma-4-31b-it:free" },
                { value: "google/gemma-4-26b-a4b-it:free", label: "google/gemma-4-26b-a4b-it:free" },
                { value: "nvidia/llama-nemotron-rerank-vl-1b-v2:free", label: "nvidia/llama-nemotron-rerank-vl-1b-v2:free" },
                { value: "nex-agi/nex-n2-pro:free", label: "nex-agi/nex-n2-pro:free" },
                { value: "nvidia/nemotron-3.5-content-safety:free", label: "nvidia/nemotron-3.5-content-safety:free" },
                { value: "nvidia/nemotron-3-ultra-550b-a55b:free", label: "nvidia/nemotron-3-ultra-550b-a55b:free" },
                { value: "nvidia/nemotron-3-super-120b-a12b:free", label: "nvidia/nemotron-3-super-120b-a12b:free" }
            ]
        };

        const configSavedModel = "{{ config.model }}";
        let logSource = null;

        // Initialize lucide icons
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            
            // Set initial timestamps
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('initTime').textContent = timeStr;
            
            // Load correct model list and key fields
            onProviderChange();
            checkBotStatus();
            
            // Periodically check bot status
            setInterval(checkBotStatus, 3000);
        });

        // Toggle Password visibility
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('leetcodePassword');
            const toggleIcon = document.getElementById('togglePasswordBtn');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                toggleIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Change layout/models when Provider is switched
        function onProviderChange() {
            const provider = document.getElementById('apiProvider').value;
            const modelSelect = document.getElementById('apiModel');
            
            // Toggle key panels
            document.getElementById('geminiKeyGroup').classList.remove('active');
            document.getElementById('openrouterKeyGroup').classList.remove('active');
            
            if (provider === 'gemini') {
                document.getElementById('geminiKeyGroup').classList.add('active');
            } else {
                document.getElementById('openrouterKeyGroup').classList.add('active');
            }

            // Populate models
            modelSelect.innerHTML = "";
            const models = MODELS[provider] || [];
            models.forEach(model => {
                const opt = document.createElement('option');
                opt.value = model.value;
                opt.textContent = model.label;
                if (model.value === configSavedModel) {
                    opt.selected = true;
                }
                modelSelect.appendChild(opt);
            });
        }

        // Set difficulty value from clicked cards
        function setDifficulty(diff) {
            document.getElementById('problemDifficulty').value = diff;
            
            // Update active state in cards
            document.querySelectorAll('.difficulty-card').forEach(card => {
                card.classList.remove('active');
            });
            
            const cardClass = diff.toLowerCase();
            document.querySelector(`.difficulty-card.${cardClass}`).classList.add('active');
        }

        // Update Slider value text
        function updateSliderVal(val) {
            document.getElementById('typingDelayVal').textContent = `${val} ms`;
        }

        // Add a log entry to the terminal
        function addLog(text) {
            const terminal = document.getElementById('terminal');
            
            // Extract log type from prefix (e.g. "[Auth] Message" -> type="auth")
            let logType = "system";
            let cleanText = text;
            
            const match = text.match(/^\[([A-Za-z]+)\]/);
            if (match) {
                const prefix = match[1].toLowerCase();
                if (["system", "auth", "navigation", "problem", "editor", "ai", "submit", "success", "error", "warning"].includes(prefix)) {
                    logType = prefix;
                }
            }

            // Special keyword match for styling
            if (text.includes("Accepted") || text.includes("solved successfully")) {
                logType = "success";
            } else if (text.includes("failed") || text.includes("Error")) {
                logType = "error";
            }

            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];

            const entry = document.createElement('div');
            entry.className = `log-entry ${logType}`;
            
            const timeSpan = document.createElement('span');
            timeSpan.className = 'log-time';
            timeSpan.textContent = timeStr;
            
            const textSpan = document.createElement('span');
            textSpan.textContent = cleanText;
            
            entry.appendChild(timeSpan);
            entry.appendChild(textSpan);
            terminal.appendChild(entry);
            
            // Auto scroll to bottom
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Clear terminal logs
        function clearLogs() {
            const terminal = document.getElementById('terminal');
            terminal.innerHTML = "";
            addLog("[System] Logs cleared.");
        }

        // Copy all terminal logs
        function copyLogs() {
            const logs = Array.from(document.querySelectorAll('.log-entry'))
                .map(el => {
                    const time = el.querySelector('.log-time').textContent;
                    const text = el.querySelector('span:not(.log-time)').textContent;
                    return `[${time}] ${text}`;
                })
                .join('\n');
                
            navigator.clipboard.writeText(logs).then(() => {
                alert("Logs copied to clipboard!");
            });
        }

        // Get inputs config payload
        function getConfigPayload() {
            return {
                email: document.getElementById('leetcodeEmail').value,
                password: document.getElementById('leetcodePassword').value,
                provider: document.getElementById('apiProvider').value,
                model: document.getElementById('apiModel').value,
                gemini_key: document.getElementById('geminiKey').value,
                openrouter_key: document.getElementById('openrouterKey').value,
                topic: document.getElementById('problemTopic').value,
                difficulty: document.getElementById('problemDifficulty').value,
                typing_delay: document.getElementById('typingDelay').value
            };
        }

        // Check if bot is already running
        async function checkBotStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                updateUIForStatus(data.running);
            } catch (e) {
                console.error("Error checking bot status:", e);
            }
        }

        function updateUIForStatus(isRunning) {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const bootBtn = document.getElementById('bootBtn');
            const stopBtn = document.getElementById('stopBtn');
            
            // Inputs to disable when running
            const inputs = [
                'leetcodeEmail', 'leetcodePassword', 'apiProvider', 
                'apiModel', 'geminiKey', 'openrouterKey', 
                'problemTopic', 'typingDelay'
            ];

            if (isRunning) {
                statusDot.className = "status-dot running";
                statusText.textContent = "Bot Running";
                bootBtn.style.display = "none";
                stopBtn.style.display = "flex";
                
                inputs.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.disabled = true;
                });
                document.querySelectorAll('.difficulty-card').forEach(el => el.style.pointerEvents = 'none');
                
                // Open event stream if not already connected
                connectLogStream();
            } else {
                statusDot.className = "status-dot";
                statusText.textContent = "System Idle";
                bootBtn.style.display = "flex";
                stopBtn.style.display = "none";
                
                inputs.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.disabled = false;
                });
                document.querySelectorAll('.difficulty-card').forEach(el => el.style.pointerEvents = 'auto');
                
                // Disconnect event stream
                disconnectLogStream();
            }
        }

        // Connect SSE stream
        function connectLogStream() {
            if (logSource !== null) return;
            
            logSource = new EventSource('/stream');
            logSource.onmessage = function(event) {
                if (event.data && event.data.trim().length > 0) {
                    addLog(event.data);
                }
            };
            logSource.onerror = function() {
                addLog("[System] Log stream disconnected.");
                disconnectLogStream();
            };
        }

        function disconnectLogStream() {
            if (logSource !== null) {
                logSource.close();
                logSource = null;
            }
        }

        // Boot the bot program
        async function bootProgram() {
            const payload = getConfigPayload();
            
            if (!payload.email || !payload.password) {
                alert("Please fill in your LeetCode credentials!");
                return;
            }
            
            const currentKey = payload.provider === 'gemini' ? payload.gemini_key : payload.openrouter_key;
            if (!currentKey) {
                alert("Please enter the API key for the selected provider!");
                return;
            }

            // Save config if requested
            if (document.getElementById('saveConfig').checked) {
                try {
                    await fetch('/api/config', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.error("Failed to save config to .env:", e);
                }
            }

            // Start bot
            try {
                addLog("[System] Dispatching startup signal...");
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                if (data.success) {
                    updateUIForStatus(true);
                    addLog("[System] Bot initiated successfully!");
                } else {
                    addLog(`[Error] Failed to start: ${data.error}`);
                    alert(`Error: ${data.error}`);
                }
            } catch (e) {
                addLog(`[Error] Failed to connect to server: ${e}`);
            }
        }

        // Stop the bot program
        async function stopProgram() {
            try {
                addLog("[System] Dispatching stop signal...");
                const response = await fetch('/api/stop', {
                    method: 'POST'
                });
                const data = await response.json();
                if (data.success) {
                    addLog("[System] Stop signal received. Cleaning up browser...");
                } else {
                    addLog(`[Error] Failed to stop bot: ${data.error}`);
                }
            } catch (e) {
                addLog(`[Error] Connection failure: ${e}`);
            }
        }
    </script>
</body>
</html>
